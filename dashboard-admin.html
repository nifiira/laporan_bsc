<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Admin - Rekapitulasi Kinerja</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <style>
      .admin-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: white;
      }
      .admin-table th,
      .admin-table td {
        border: 1px solid #cbd5e1;
        padding: 12px;
        text-align: left;
      }
      .admin-table th {
        background-color: #1e3a8a;
        color: white;
      }
      .rsud-row {
        background-color: #f8fafc;
      }
      .pkm-row {
        background-color: #eff6ff;
      }
      .btn-aksi {
        background: #3b82f6;
        color: white;
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-excel {
        background: #10b981;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 15px;
      }

      /* Gaya untuk Pop-up (Modal) Detail */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 999;
      }
      .modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        width: 80%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }
      .close-btn {
        float: right;
        background: #ef4444;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container-dashboard">
      <div class="header">
        <h2>Panel Admin Dinkes</h2>
        <p>Rekapitulasi Seluruh Laporan RSUD dan Puskesmas</p>
        <div style="text-align: right; margin-bottom: 15px">
          <span>Halo, Admin: <strong id="namaUser">-</strong></span> |
          <button
            onclick="logoutUser()"
            style="
              background: #ef4444;
              color: white;
              border: none;
              padding: 5px 10px;
              border-radius: 4px;
              cursor: pointer;
            "
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
          </button>
        </div>
      </div>

      <div
        style="
          background: white;
          padding: 20px;
          border-radius: 8px;
          border: 1px solid #cbd5e1;
        "
      >
        <!-- Tombol Cetak Semua -->
        <button class="btn-excel" onclick="exportExcelAdmin()">
          <i class="fa-solid fa-file-excel"></i> Cetak Seluruh Data Instansi
          (Excel)
        </button>

        <table class="admin-table">
          <thead>
            <tr>
              <th>Nama Instansi</th>
              <th>Periode</th>
              <th>Total Skor Akhir</th>
              <th>Predikat</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelRekapAdmin">
            <tr>
              <td colspan="5" style="text-align: center">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Container Modal Detail -->
    <div id="modalDetailAdmin" class="modal-overlay">
      <div class="modal-content">
        <button class="close-btn" onclick="tutupModalAdmin()">Tutup X</button>
        <h3 id="judulModal" style="margin-top: 0">Detail Penilaian</h3>
        <div id="isiModalDetail" style="margin-top: 15px"></div>
      </div>
    </div>

    <!-- PANGGIL SKRIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
